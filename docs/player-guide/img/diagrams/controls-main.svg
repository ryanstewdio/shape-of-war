    <g transform="translate(430,240)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">5</text></g>
    <g transform="translate(42,810)"><circle r="14" fill="#000" stroke="#ff5a5a" stroke-width="2"/><text y="6" fill="#ff5a5a">6</text></g>
    <g transform="translate(750,94)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">7</text></g>
    <g transform="translate(740,460)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">8</text></g>
    <g transform="translate(740,536)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">9</text></g>
    <g transform="translate(110,106)"><circle r="14" fill="#000" stroke="#5ac8ff" stroke-width="2"/><text y="6" fill="#5ac8ff">10</text></g>
    <g transform="translate(796,600)"><circle r="14" fill="#000" stroke="#5ac8ff" stroke-width="2"/><text y="6" fill="#5ac8ff">11</text></g>
    <g transform="translate(654,744)"><circle r="14" fill="#000" stroke="#9fffb0" stroke-width="2"/><text y="6" fill="#9fffb0">12</text></g>
  </g>
  <text x="70" y="814" fill="#cfe9f2" font-size="14">Dashed pink squares are the real hit areas. Dotted green circles show the 120 px stick reach.</text>
  <text x="70" y="832" fill="#cfe9f2" font-size="14">Top band 60 px, right column 68 px. Super above bomb, stacked high above the right thumb's rest area.</text>
