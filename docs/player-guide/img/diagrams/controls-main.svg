<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" width="860" height="840" font-family="sans-serif">
  <title>Shape Legend controls, main screen (10:9)</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="860" height="840" fill="#000"/>
  <text x="30" y="36" fill="#cfe9f2" font-size="20">Main screen (10:9): touch zones and buttons. Schematic, 1 unit = 1 CSS px.</text>
  <g transform="translate(30,60)" filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="800" height="720" rx="18" fill="none" stroke="#cfe9f2" stroke-width="2.5"/>
    <rect x="0" y="0" width="24" height="720" fill="#ff5a5a" fill-opacity="0.18" stroke="none"/>
    <rect x="776" y="0" width="24" height="720" fill="#ff5a5a" fill-opacity="0.18" stroke="none"/>
    <rect x="0" y="0" width="800" height="60" fill="#5ac8ff" fill-opacity="0.06" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="732" y="60" width="68" height="660" fill="#5ac8ff" fill-opacity="0.06" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="24" y="80" width="690" height="620" rx="6" fill="none" stroke="#3d64ff" stroke-width="2"/>
    <line x1="400" y1="6" x2="400" y2="714" stroke="#ffd85a" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="200" y="712" fill="#ffd85a" font-size="15" text-anchor="middle">left half: move</text>
    <text x="580" y="632" fill="#ffd85a" font-size="15" text-anchor="middle">right half: aim and fire</text>
    <circle cx="210" cy="460" r="120" fill="none" stroke="#9fffb0" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="210" cy="460" r="14.4" fill="none" stroke="#9fffb0" stroke-width="1.2"/>
    <circle cx="280" cy="420" r="21.6" fill="#e6faff" fill-opacity="0.3" stroke="none"/>
    <line x1="210" y1="460" x2="280" y2="420" stroke="#9fffb0" stroke-width="1.5"/>
    <circle cx="560" cy="460" r="120" fill="none" stroke="#9fffb0" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="560" cy="460" r="14.4" fill="none" stroke="#9fffb0" stroke-width="1.2"/>
    <circle cx="490" cy="400" r="21.6" fill="#e6faff" fill-opacity="0.3" stroke="none"/>
    <line x1="560" y1="460" x2="490" y2="400" stroke="#9fffb0" stroke-width="1.5"/>
    <rect x="544" y="652" width="160" height="64" fill="#9fffb0" fill-opacity="0.08" stroke="#9fffb0" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="2 5"/>
    <rect x="740" y="4" width="56" height="56" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <rect x="759" y="22" width="4.4" height="14" fill="#e6faff"/>
    <rect x="769" y="22" width="4.4" height="14" fill="#e6faff"/>
    <text x="764" y="366" fill="#ffe75a" font-size="13" font-weight="700" text-anchor="middle">TURBO</text>
    <rect x="732" y="368" width="64" height="64" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="764" cy="400" r="28" fill="#ffe75a" fill-opacity="0.18" stroke="#ffe75a" stroke-width="2.5"/>
    <path d="M738 410 A28 28 0 0 0 790 410 Z" fill="#5ac8ff" fill-opacity="0.55" stroke="none"/>
    <text x="764" y="442" fill="#cfe9f2" font-size="13" font-weight="700" text-anchor="middle">BOMB</text>
    <rect x="732" y="444" width="64" height="64" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="764" cy="476" r="28" fill="#cfe9f2" fill-opacity="0.15" stroke="#cfe9f2" stroke-width="2.5"/>
    <text x="764" y="483" fill="#cfe9f2" font-size="20" text-anchor="middle">3</text>
  </g>
  <line x1="42" y1="796" x2="42" y2="770" stroke="#ff5a5a" stroke-width="1.5"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(170,300)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">1</text></g>
    <g transform="translate(640,300)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">2</text></g>
